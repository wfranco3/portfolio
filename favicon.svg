<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Brilho sutil no ponto de acento -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#3B5BF5" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo ONA Brand (Neutral com cantos arredondados suaves e borda sutil) -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7" fill="#0B0F1E" stroke="#252E45" stroke-width="1.5"/>
  
  <!-- Letra M robusta, simétrica e alinhada à grade de pixels -->
  <path d="M6.5 23.5V8.5H10.2L14.5 16.8L18.8 8.5H22.5V23.5H19.5V13.8L15.6 21.2H13.4L9.5 13.8V23.5H6.5Z" fill="#FFFFFF"/>
  
  <!-- Ponto de Acento ONA Brand (Tertiary #3B5BF5) posicionado como assinatura -->
  <circle cx="25" cy="21.5" r="2" fill="#3B5BF5" filter="url(#glow)"/>
</svg>
